[package]
name = "mlmodelc-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Compile a CoreML MLProgram protobuf into a runnable .mlmodelc bundle in pure Rust, without invoking Apple's coremlc."
repository = "https://github.com/rebeckerspecialties/mlmodelc-export"
homepage = "https://github.com/rebeckerspecialties/mlmodelc-export"
documentation = "https://docs.rs/mlmodelc-export"
keywords = ["coreml", "mlmodelc", "watchos", "mlprogram", "mil"]
categories = ["compilers", "encoding", "no-std"]
readme = "README.md"

[lib]
name = "mlmodelc_export"
path = "src/lib.rs"

[[bin]]
name = "mlmodelc-export"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Build the CLI binary (drop for library-only consumers).
cli = ["dep:clap"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
